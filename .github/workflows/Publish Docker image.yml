name: Publish Docker image

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-v2bx-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alioth-software-llc/v2bx
  IMAGE_VERSION: ${{ github.ref_name }}
  IMAGE_REVISION: ${{ github.sha }}
  UPSTREAM_REVISION: 71277de69efbbc86c23ad8ae02b68efd174e5756
  PATCH_REVISION: 3a7b882caf935d68d4fe886125cbed06a6e2d020
  PATCH_CONTRACT: empty-user-list-revokes-authorized-users

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.IMAGE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and patch lineage
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Docker releases must run from a Git tag" >&2
            exit 1
          fi
          if [[ ! "${IMAGE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alioth\.[0-9]+$ ]]; then
            echo "Invalid Alioth image version: ${IMAGE_VERSION}" >&2
            exit 1
          fi
          if [[ ! "${IMAGE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid image revision: ${IMAGE_REVISION}" >&2
            exit 1
          fi

          checked_out_revision="$(git rev-parse HEAD)"
          if [[ "${checked_out_revision}" != "${IMAGE_REVISION}" ]]; then
            echo "Checkout revision ${checked_out_revision} does not match ${IMAGE_REVISION}" >&2
            exit 1
          fi
          tag_revision="$(git rev-parse "refs/tags/${IMAGE_VERSION}^{commit}")"
          if [[ "${tag_revision}" != "${IMAGE_REVISION}" ]]; then
            echo "Git tag ${IMAGE_VERSION} does not resolve to ${IMAGE_REVISION}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${PATCH_REVISION}^")" != "${UPSTREAM_REVISION}" ]]; then
            echo "Patch revision is not based directly on the recorded upstream revision" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${PATCH_REVISION}" "${IMAGE_REVISION}"; then
            echo "Image revision does not contain the required entitlement patch" >&2
            exit 1
          fi
          if ! git diff --quiet "${PATCH_REVISION}" "${IMAGE_REVISION}" -- \
            api/panel/user_test.go node/user_snapshot_test.go; then
            echo "Required entitlement contract tests differ from the attested patch revision" >&2
            exit 1
          fi

      - name: Verify GHCR publication guards
        run: .github/scripts/test-resolve-ghcr-tag-state.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify entitlement revocation contract
        run: GOEXPERIMENT=jsonv2 go test ./api/panel ./node

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.IMAGE_REVISION }}
          persist-credentials: false
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform }}
          build-args: |
            V2BX_IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            V2BX_IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            V2BX_UPSTREAM_REVISION=${{ env.UPSTREAM_REVISION }}
            V2BX_PATCH_REVISION=${{ env.PATCH_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/Alioth-Software-LLC/V2bX
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ env.IMAGE_REVISION }}
            com.alioth.v2bx.upstream-revision=${{ env.UPSTREAM_REVISION }}
            com.alioth.v2bx.patch-revision=${{ env.PATCH_REVISION }}
            com.alioth.v2bx.patch=${{ env.PATCH_CONTRACT }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid build digest: ${BUILD_DIGEST}" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          digest="${BUILD_DIGEST#sha256:}"
          printf '%s\n' "${digest}" > "/tmp/digests/${digest}"
  
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact image source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.IMAGE_REVISION }}
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create manifest list and push
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          shopt -s nullglob
          digest_files=(*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected exactly two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi
          images=()
          for digest_file in "${digest_files[@]}"; do
            if [[ ! "${digest_file}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid digest artifact name: ${digest_file}" >&2
              exit 1
            fi
            digest="$(<"${digest_file}")"
            if [[ "${digest}" != "${digest_file}" ]]; then
              echo "Digest artifact content does not match its name" >&2
              exit 1
            fi
            images+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          expected_manifest_file="${RUNNER_TEMP}/v2bx-expected-manifest.json"
          docker buildx imagetools create --dry-run \
            "${images[@]}" > "${expected_manifest_file}"

          resolve_tag_state() {
            "${GITHUB_WORKSPACE}/.github/scripts/resolve-ghcr-tag-state.sh" \
              "${expected_manifest_file}"
          }

          require_matching_tag() {
            local attempt state
            for attempt in 1 2 3 4 5; do
              state="$(resolve_tag_state)" || return 1
              case "${state}" in
                matching)
                  return 0
                  ;;
                absent)
                  if (( attempt < 5 )); then
                    sleep $((attempt * 2))
                  fi
                  ;;
                *)
                  echo "Unexpected GHCR tag state: ${state}" >&2
                  return 1
                  ;;
              esac
            done
            echo "Published image did not converge to the expected manifest" >&2
            return 1
          }

          publication_state="$(resolve_tag_state)"
          if [[ "${publication_state}" != "absent" && "${publication_state}" != "matching" ]]; then
            echo "Unexpected GHCR tag state: ${publication_state}" >&2
            exit 1
          fi

          remote_tag_refs="$({
            git -C "${GITHUB_WORKSPACE}" ls-remote --exit-code origin \
              "refs/tags/${IMAGE_VERSION}" \
              "refs/tags/${IMAGE_VERSION}^{}"
          })"
          direct_tag_revision=""
          peeled_tag_revision=""
          while read -r revision ref_name; do
            case "${ref_name}" in
              "refs/tags/${IMAGE_VERSION}")
                direct_tag_revision="${revision}"
                ;;
              "refs/tags/${IMAGE_VERSION}^{}")
                peeled_tag_revision="${revision}"
                ;;
              *)
                echo "Unexpected remote tag ref: ${ref_name}" >&2
                exit 1
                ;;
            esac
          done <<<"${remote_tag_refs}"
          live_tag_revision="${peeled_tag_revision:-${direct_tag_revision}}"
          if [[ ! "${live_tag_revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot resolve live Git tag ${IMAGE_VERSION} to a commit" >&2
            exit 1
          fi
          if [[ "${live_tag_revision}" != "${IMAGE_REVISION}" ]]; then
            echo "Live Git tag ${IMAGE_VERSION} resolves to ${live_tag_revision}, expected ${IMAGE_REVISION}" >&2
            exit 1
          fi

          if [[ "${publication_state}" == "absent" ]]; then
            if ! docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}" \
              "${images[@]}"; then
              echo "Manifest publication reported failure; checking for an exact committed result" >&2
            fi
          else
            echo "Image tag already contains the exact requested manifest; publication is idempotently complete."
          fi

          require_matching_tag
          
      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
